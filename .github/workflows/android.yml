name: Android Debug APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode debug keystore
        run: base64 -d app/debug.keystore.b64 > app/debug.keystore
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept licenses and install SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Download Gradle 8.0
        run: |
          curl -sL -o gradle-8.0-bin.zip https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
      - name: Build debug APK
        run: ./gradle-8.0/bin/gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0-debug-${{ github.run_number }}
          name: 生活工作台 debug APK（第 ${{ github.run_number }} 次构建）
          body: |
            debug 测试包，骨架版：首页 / 今日计划 / 设置 3 个页面，离线使用。
            安装前需允许“安装未知来源应用”。
          files: app/build/outputs/apk/debug/app-debug.apk